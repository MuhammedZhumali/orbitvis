services:
  postgis:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: orbituser
      POSTGRES_PASSWORD: orbit_pass
      POSTGRES_DB: orbitdb
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbituser -d orbitdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app-network

  backend:
    build: .
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/orbitdb
      SPRING_DATASOURCE_USERNAME: orbituser
      SPRING_DATASOURCE_PASSWORD: orbit_pass
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgis-data:

